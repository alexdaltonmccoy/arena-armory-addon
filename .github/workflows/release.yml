# Packages the addon and uploads it to CurseForge, Wago, and GitHub Releases
# whenever a version tag (v1.2.3) is pushed. WowUp installs from CurseForge /
# Wago / GitHub automatically once those listings exist - no extra publishing
# step needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CF_API_KEY      - https://authors.curseforge.com/account/api-tokens
#   WAGO_API_TOKEN  - https://addons.wago.io/account/apikeys
# GITHUB_TOKEN is provided automatically for the GitHub release.
#
# The upload targets are resolved from the TOC:
#   ## X-Curse-Project-ID: <numeric id from the CurseForge project page>
#   ## X-Wago-ID: <id from the Wago addon dashboard>
name: Release AddOn

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md covers this version
        run: |
          TAG="${GITHUB_REF_NAME}"
          FOUND=0
          while IFS= read -r line; do
            case "$line" in
              "## $TAG "*|"## $TAG") FOUND=1; break ;;
            esac
          done < CHANGELOG.md
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::CHANGELOG.md has no '## $TAG' entry. .pkgmeta points the release changelog at CHANGELOG.md (see manual-changelog) - if this tag has no matching entry, BigWigsMods/packager silently falls back to a raw git-log changelog, which has leaked internal commit detail to CurseForge/Wago before. Add a player-facing '## $TAG (date)' section before tagging."
            exit 1
          fi

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
